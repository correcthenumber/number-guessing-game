<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>숫자 맞추기 게임</title>
  <style>
    :root { color-scheme: light; --bg:#f7f5ef; --glow1:#d7fff1; --glow2:#e4e0ff; --card:rgba(255,253,248,.88); --ink:#172033; --muted:#6e7890; --line:#e2e4ea; --soft:#f0eff7; --stat:#f6f4ef; --mint:#4bd1b4; --purple:#7667f8; --purple-soft:#ebe8ff; --rank:#fff8df; }
    [data-theme="dark"] { color-scheme: dark; --bg:#10131d; --glow1:#153b36; --glow2:#27224b; --card:rgba(27,32,47,.91); --ink:#f5f7ff; --muted:#aeb7ca; --line:#3a4257; --soft:#242a3a; --stat:#202635; --purple:#948aff; --purple-soft:#322d57; --rank:#332f21; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; padding:24px; color:var(--ink); font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; background:radial-gradient(circle at 12% 15%,var(--glow1) 0 11%,transparent 31%),radial-gradient(circle at 88% 78%,var(--glow2) 0 12%,transparent 34%),var(--bg); transition:background .25s,color .25s; }
    .game { width:min(100%,920px); margin:0 auto; padding:28px; border:1px solid color-mix(in srgb,var(--line) 58%,transparent); border-radius:32px; background:var(--card); box-shadow:0 22px 50px rgba(10,14,30,.18); backdrop-filter:blur(8px); }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; }.theme-toggle { min-height:40px; padding:0 13px; background:var(--soft); color:var(--ink); font-size:.86rem; }
    .layout { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(270px,.9fr); gap:32px; align-items:center; }.play { text-align:center; padding:10px 12px; }.badge { display:inline-flex; gap:7px; padding:8px 13px; border-radius:999px; color:#236456; background:#dffff4; font-size:.78rem; font-weight:800; } [data-theme="dark"] .badge { color:#bfffe8; background:#1e5148; }
    h1 { margin:18px 0 8px; font-size:clamp(2rem,6vw,2.7rem); letter-spacing:-.07em; }.intro { margin:0 auto 26px; color:var(--muted); line-height:1.65; }.form { display:flex; gap:10px; } input { width:100%; min-width:0; border:2px solid var(--line); border-radius:15px; padding:15px 14px; color:var(--ink); background:transparent; font-size:1.08rem; font-weight:750; outline:none; }input:focus { border-color:var(--purple); box-shadow:0 0 0 4px color-mix(in srgb,var(--purple) 20%,transparent); }button { border:0; border-radius:15px; padding:0 20px; color:white; background:var(--purple); font-weight:800; font-size:1rem; cursor:pointer; transition:transform .16s,filter .16s; }button:hover{filter:brightness(1.07);transform:translateY(-2px)}button:active{transform:none}.message { min-height:61px; margin:22px 0 17px; display:grid; place-items:center; padding:10px; border-radius:16px; color:var(--ink); background:var(--soft); font-weight:750; line-height:1.45; }.message.high{background:#fff0e4;color:#a24e18}.message.low{background:#e5f8ff;color:#176882}.message.win{background:#ddfae8;color:#167247}[data-theme="dark"] .message.high{background:#572f25;color:#ffbf9c}[data-theme="dark"] .message.low{background:#183e50;color:#a8e8ff}[data-theme="dark"] .message.win{background:#1e5339;color:#b9ffd7}
    .stats{display:flex;gap:12px;text-align:left}.stat{flex:1;padding:14px 15px;border-radius:16px;background:var(--stat)}.stat small{display:block;margin-bottom:3px;color:var(--muted);font-size:.76rem;font-weight:700}.stat strong{font-size:1.2rem}.restart{width:100%;min-height:49px;margin-top:24px;color:var(--ink);background:var(--purple-soft)}
    .ranking { padding:23px; border-radius:24px; background:var(--rank); text-align:left; }.ranking h2 { margin:0; font-size:1.2rem; }.ranking p { margin:7px 0 15px; color:var(--muted); font-size:.84rem; }.rank-list { min-height:220px; margin:0; padding:0; list-style:none; }.rank-list li { display:grid; grid-template-columns:27px 1fr auto; align-items:center; gap:8px; padding:10px 1px; border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent); font-size:.9rem; }.rank-list li:last-child{border:0}.rank-list .place{font-weight:900;color:var(--purple)}.rank-list .meta{color:var(--muted);font-size:.76rem}.empty{display:block!important;padding:35px 4px!important;color:var(--muted);text-align:center}.clear { width:100%; min-height:40px; margin-top:14px; color:var(--muted); background:transparent; border:1px solid var(--line); font-size:.84rem; }.clear:disabled{opacity:.5;cursor:not-allowed}.name-modal { position:fixed; inset:0; z-index:3; display:none; place-items:center; padding:22px; background:#080b1380; }.name-modal.show{display:grid}.modal-card{width:min(100%,380px);padding:28px;border-radius:24px;background:var(--card);box-shadow:0 24px 80px #0005}.modal-card h2{margin:0 0 7px}.modal-card p{margin:0 0 18px;color:var(--muted);line-height:1.5}.modal-card input{margin-bottom:11px}.modal-card button{width:100%;min-height:49px}.confetti{position:fixed;width:10px;height:18px;top:-20px;border-radius:3px;pointer-events:none;animation:fall 1.9s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(520deg);opacity:0}}
    @media(max-width:720px){body{padding:14px}.game{padding:19px;border-radius:25px}.layout{grid-template-columns:1fr;gap:22px}.ranking{padding:20px}.rank-list{min-height:initial}.rank-list li{padding:8px 1px}}@media(max-width:390px){.form{flex-direction:column}button{min-height:52px}.stats{gap:8px}.stat{padding:12px}}
  </style>
</head>
<body>
  <main class="game"><header class="topbar"><div class="badge">✦ 집중 모드</div><button class="theme-toggle" id="themeToggle" type="button" aria-label="다크 모드로 전환">🌙 다크 모드</button></header>
    <div class="layout"><section class="play"><h1>숫자 맞추기</h1><p class="intro">컴퓨터가 고른 <b>1부터 100까지</b>의 숫자를 맞혀보세요.</p><form class="form" id="guessForm"><input id="guess" type="number" inputmode="numeric" min="1" max="100" placeholder="숫자를 입력하세요" autocomplete="off" autofocus /><button type="submit">확인</button></form><div class="message" id="message" aria-live="polite">첫 번째 숫자를 입력해 보세요!</div><section class="stats" aria-label="게임 현황"><div class="stat"><small>시도 횟수</small><strong id="attempts">0회</strong></div><div class="stat"><small>현재 범위</small><strong id="range">1 — 100</strong></div></section><button class="restart" id="restart" type="button">새 게임 시작</button></section>
      <aside class="ranking" aria-label="랭킹"><h2>🏆 명예의 전당</h2><p>적은 횟수, 빠른 시간 순으로 저장됩니다.</p><ol class="rank-list" id="rankList"></ol><button class="clear" id="clearRanks" type="button">랭킹 초기화</button></aside>
    </div></main>
  <div class="name-modal" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><h2 id="modalTitle">새 기록이에요! 🎉</h2><p id="resultText"></p><form id="nameForm"><input id="playerName" maxlength="12" placeholder="이름 또는 별명 (최대 12자)" autocomplete="nickname" required /><button type="submit">랭킹에 등록하기</button></form></div></div>
  <script>
    const $=id=>document.getElementById(id), form=$('guessForm'),input=$('guess'),message=$('message'),attemptsEl=$('attempts'),rangeEl=$('range'),rankList=$('rankList'),clearButton=$('clearRanks'),modal=$('nameModal'),nameForm=$('nameForm'),playerName=$('playerName');
    const RANK_KEY='numberGuessRanksV1', THEME_KEY='numberGuessThemeV1'; let target,attempts,min,max,finished,startedAt;
    function safeRanks(){try{const r=JSON.parse(localStorage.getItem(RANK_KEY)||'[]');return Array.isArray(r)?r.filter(x=>x&&typeof x.name==='string'&&Number.isInteger(x.attempts)&&Number.isFinite(x.seconds)):[]}catch{return[]}}
    function renderRanks(){const ranks=safeRanks().sort((a,b)=>a.attempts-b.attempts||a.seconds-b.seconds).slice(0,10);rankList.innerHTML='';clearButton.disabled=!ranks.length;if(!ranks.length){rankList.innerHTML='<li class="empty">아직 기록이 없어요.<br>첫 번째 주인공이 되어 보세요!</li>';return}ranks.forEach((r,i)=>{const li=document.createElement('li'),n=document.createElement('span'),info=document.createElement('span'),score=document.createElement('strong');n.className='place';n.textContent=`${i+1}.`;info.innerHTML=`<b></b><span class="meta"></span>`;info.querySelector('b').textContent=r.name;info.querySelector('.meta').textContent=` · ${r.seconds}초`;score.textContent=`${r.attempts}회`;li.append(n,info,score);rankList.append(li)})}
    function setMessage(text,type=''){message.textContent=text;message.className=`message ${type}`}
    function newGame(){target=Math.floor(Math.random()*100)+1;attempts=0;min=1;max=100;finished=false;startedAt=Date.now();input.value='';input.disabled=false;attemptsEl.textContent='0회';rangeEl.textContent='1 — 100';setMessage('첫 번째 숫자를 입력해 보세요!');input.focus()}
    function celebrate(){for(let i=0;i<34;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.left=`${45+Math.random()*10}%`;bit.style.background=['#7667f8','#4bd1b4','#ffbe53','#ff7c76'][i%4];bit.style.setProperty('--x',`${(Math.random()-.5)*480}px`);bit.style.animationDelay=`${Math.random()*.28}s`;document.body.append(bit);setTimeout(()=>bit.remove(),2300)}}
    function finish(){finished=true;input.disabled=true;const seconds=Math.max(1,Math.round((Date.now()-startedAt)/1000));setMessage(`정답! ${attempts}번 만에 숫자 ${target}을(를) 맞혔어요. 🎉`,'win');$('resultText').textContent=`${attempts}회 시도 · ${seconds}초 기록입니다. 이름을 남겨 주세요.`;modal.dataset.attempts=attempts;modal.dataset.seconds=seconds;modal.classList.add('show');playerName.value='';setTimeout(()=>playerName.focus(),0);celebrate()}
    form.addEventListener('submit',e=>{e.preventDefault();if(finished)return;const guess=Number(input.value);if(!Number.isInteger(guess)||guess<1||guess>100){setMessage('1부터 100 사이의 정수를 입력해 주세요.');input.focus();return}attempts++;attemptsEl.textContent=`${attempts}회`;if(guess===target){finish();return}if(guess<target){min=Math.max(min,guess+1);setMessage(`${guess}보다 큰 숫자예요. 더 높게! ↑`,'low')}else{max=Math.min(max,guess-1);setMessage(`${guess}보다 작은 숫자예요. 더 낮게! ↓`,'high')}rangeEl.textContent=`${min} — ${max}`;input.value='';input.focus()});
    nameForm.addEventListener('submit',e=>{e.preventDefault();const name=playerName.value.trim().replace(/\s+/g,' ');if(!name){playerName.focus();return}const ranks=safeRanks();ranks.push({name:name.slice(0,12),attempts:Number(modal.dataset.attempts),seconds:Number(modal.dataset.seconds)});try{localStorage.setItem(RANK_KEY,JSON.stringify(ranks.sort((a,b)=>a.attempts-b.attempts||a.seconds-b.seconds).slice(0,10)))}catch{}modal.classList.remove('show');renderRanks()});
    clearButton.addEventListener('click',()=>{if(confirm('저장된 랭킹을 모두 지울까요?')){try{localStorage.removeItem(RANK_KEY)}catch{}renderRanks()}});$('restart').addEventListener('click',newGame);$('themeToggle').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('themeToggle').textContent=dark?'☀️ 라이트 모드':'🌙 다크 모드';$('themeToggle').setAttribute('aria-label',dark?'라이트 모드로 전환':'다크 모드로 전환');try{localStorage.setItem(THEME_KEY,dark?'dark':'light')}catch{}});try{if(localStorage.getItem(THEME_KEY)==='dark')$('themeToggle').click()}catch{}renderRanks();newGame();
  </script>
</body>
</html>
